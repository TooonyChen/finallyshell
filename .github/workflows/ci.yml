name: ci

# The checks every change must pass. The release workflow runs them too,
# before it builds.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go tool mygo vet
      - run: go test -race ./...
