name: ci

# The checks every change must pass. The release workflow runs them too,
# before it builds.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            # go fmt uses the gofmt of go.mod's toolchain; a gofmt on PATH
            # from another Go version can align comments differently.
            echo "::error::Not formatted, run go fmt ./...:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go tool mygo vet
      # The tests load libghostty-vt, which MyGo's terminal plugin downloads
      # from GitHub into <os.UserCacheDir()>/mygo/natives/<sha256>/, once
      # per process. Keep it between runs, keyed by go.sum (the MyGo
      # version decides the library), and fetch it with retries before the
      # tests, so that a 504 from GitHub doesn't fail them.
      - name: natives cache folder
        id: natives
        # os.UserCacheDir on Linux: $XDG_CACHE_HOME, else ~/.cache.
        run: echo "dir=${XDG_CACHE_HOME:-$HOME/.cache}/mygo/natives" >> "$GITHUB_OUTPUT"
      - name: restore native libraries
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.natives.outputs.dir }}
          key: mygo-natives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
      - name: fetch native libraries
        id: fetch
        run: go run ./tools/natives
      # Saved as soon as the download succeeds, so it is kept even when the
      # tests then fail; never after a failed one, which would keep an
      # empty folder under the key for good.
      - name: save native libraries
        if: always() && steps.fetch.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.natives.outputs.dir }}
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: staticcheck
        # The checks go vet does not have: unused values, impossible
        # conditions, deprecated API, and the style checks we keep.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./...
      - name: govulncheck
        # Only what the code actually reaches: a CVE in a package nothing
        # calls does not fail the build.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Fuzz the sync envelope
        # Half a minute per run on the parser that reads a file another
        # machine wrote. The seeds run in `go test` anyway; this is the
        # part that looks for what the seeds do not have.
        run: go test -run '^$' -fuzz FuzzOpen -fuzztime 30s ./internal/cloudsync
      - name: Coverage
        # Printed, not enforced: a floor that fails builds teaches people to
        # pad tests. The number in the log is enough to spot a drop.
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
